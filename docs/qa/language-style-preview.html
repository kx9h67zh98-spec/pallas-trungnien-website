<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Static QA — VIE / ENG control and forms</title><link rel="stylesheet" href="../../src/styles/globals.css"><style>body{background:#f6f8f3} .preview-panel{max-width:1024px;margin:64px auto;padding:24px}.preview-row{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:28px}.preview-form{background:white;border:1px solid #dce6d7;border-radius:18px;padding:30px;max-width:680px;margin:0 auto}.preview-form h2{font-size:32px;line-height:1.15;letter-spacing:-.03em;margin:14px 0}.preview-form p{font-size:14px;color:#667a70}.preview-form .form-grid{margin:24px 0}.preview-form .form-field{min-width:0}@media(max-width:700px){.preview-panel{margin:20px auto;padding:14px}.preview-form{padding:18px}.preview-form h2{font-size:28px}}</style></head><body><div class="preview-panel"><div class="preview-row"><strong style="font-size:19px;color:#1b3827">PALLAS</strong><div class="language-switch" role="group" aria-label="Select language"><button>VIE</button><span class="language-separator"></span><button class="active" aria-pressed="true">ENG</button></div></div><div class="preview-form pallas-form"><span class="form-step-label">01 / YOUR DETAILS</span><h2>Let's talk about your requirements</h2><p>Fill out the form and we'll prepare your enquiry</p><div class="form-grid"><div class="form-field"><label class="form-label">Full name <span class="required-mark">*</span></label><input class="form-control" value="Alex Nguyen"></div><div class="form-field has-error"><label class="form-label">Phone number <span class="required-mark">*</span></label><input class="form-control" aria-invalid="true" value="123"><p class="form-field-error">Enter a valid Vietnamese number starting with 0 or +84</p></div><div class="form-field span-2"><label class="form-label">Email address <span class="required-mark">*</span></label><input class="form-control" placeholder="name@example.com"></div></div><button class="btn btn-primary form-primary-action">Prepare email to PALLAS</button></div></div></body></html>
