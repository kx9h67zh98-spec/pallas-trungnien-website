<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>PALLAS · Form definitions</title></head><body>
<!-- Netlify parses these static declarations at deploy time. Client submits by AJAX. -->
<form name="pallas-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
 <input name="form-name" value="pallas-contact"><input name="bot-field"><input name="name"><input name="phone"><input name="email"><input name="topic"><input name="contactMethod"><textarea name="message"></textarea><input name="language"><input name="consent"><input name="source"></form>
<form name="pallas-dealer" data-netlify="true" netlify-honeypot="bot-field" hidden>
 <input name="form-name" value="pallas-dealer"><input name="bot-field"><input name="name"><input name="phone"><input name="email"><input name="business"><input name="region"><input name="interest"><input name="contactMethod"><textarea name="message"></textarea><input name="language"><input name="consent"><input name="source"></form>
<form name="pallas-quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
 <input name="form-name" value="pallas-quote"><input name="bot-field"><input name="name"><input name="phone"><input name="product"><input name="sku"><input name="volume"><input name="quantity"><textarea name="note"></textarea><input name="language"><input name="consent"><input name="source"></form>
<form name="pallas-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
 <input name="form-name" value="pallas-order"><input name="bot-field"><input name="name"><input name="phone"><input name="email"><input name="address"><input name="contactMethod"><textarea name="note"></textarea><textarea name="orderLines"></textarea><input name="subtotal"><input name="language"><input name="consent"><input name="source"></form>
</body></html>
